<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      Anuncios
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-grid>
    <ion-row>
      @for(anuncio of anuncios; track anuncio.imagen){
        <ion-col size="12" size-md="6" size-lg="4" class="ion-padding">
          <div>            
            <img  [src]="anuncio.imagen" alt="Imagen del Anuncio" style="width: 100%; height: auto; display: block;" />
            <strong>Titulo:</strong>
                {{ anuncio.titulo }} <br>
            <strong>Descripcion:</strong>
              {{ anuncio.descripcion }} <br>
            <strong>Tipo de Anuncio:</strong>
              {{ anuncio.tipo }}
          </div>
        </ion-col>
      }
    </ion-row>
  </ion-grid>
 </ion-content>
