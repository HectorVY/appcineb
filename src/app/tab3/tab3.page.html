<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      Consulta de Funciones
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-grid>
    
    <ion-row style="border-bottom: 2px solid #ccc; font-weight: bold; background-color: var(--ion-color-light);">
      <ion-col size="2">ID</ion-col>
      <ion-col size="4">Fecha</ion-col>
      <ion-col size="3">Hora</ion-col>
      <ion-col size="3">Precio</ion-col>
    </ion-row>

  
    @for(funciones of funcion; track funciones.idFuncion){
    <ion-row style="border-bottom: 1px solid #eee; align-items: center;">
      <ion-col size="2">{{funciones.idFuncion}}</ion-col>
      <ion-col size="4">{{funciones.fecha | date:'dd/MM/yyyy'}}</ion-col>
      <ion-col size="3">{{funciones.hora}}</ion-col>
      <ion-col size="3">${{funciones.precioEntrada}}</ion-col>
    </ion-row>
    } @empty {
      <ion-row>
        <ion-col size="12" class="ion-text-center">No hay funciones disponibles</ion-col>
      </ion-row>
    }

  </ion-grid>
</ion-content>
